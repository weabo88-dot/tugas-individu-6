<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Website Data Diri{% endblock %} | Eliazar Yasta Prarindra</title>

    <!-- 1. Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Special+Elite&display=swap" rel="stylesheet">
    <!-- 2. CSS sendiri (setelah Bootstrap) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block styles %}{% endblock %}
</head>
<body>

    {% include "partials/navbar.html" %}

    <main class="container my-4 my-md-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-muted py-4 small">
        ⸸ {{ "Eliazar Yasta Prarindra" }} - 1482500005 ⸸
    </footer>

    <div class="floating-meme text-center rounded">
        <img src="{{ url_for('static', filename='img/fte2fix.jfif') }}" alt="Heretic Meme"
             class="img-fluid rounded mb-1" style="max-height: 110px; object-fit: contain;">
        <p class="text-muted" style="font-size: 9px; margin: 0;">† Emperor Watches †</p>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
